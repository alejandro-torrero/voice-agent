[project]
name = "voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alejandro Torrero", email = "alejandro@lostorrero.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "isort>=9.0.1",
    "livekit>=1.1.19",
    "livekit-agents>=1.3.11",
    "livekit-plugins-deepgram>=1.3.11",
    "livekit-plugins-elevenlabs>=1.3.11",
    "livekit-plugins-openai>=1.3.11",
]

[project.scripts]
voice-agent = "voice_agent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
